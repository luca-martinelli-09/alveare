# Immagini e CLI: canale dev a ogni push su main, release a ogni tag vX.Y.Z.
# Prima di pubblicare girano i test (ci.yml); sui tag anche l'integrazione completa.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  meta:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.v.outputs.tags }}
      build: ${{ steps.v.outputs.build }}
      channel: ${{ steps.v.outputs.channel }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alveare" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cargo=$(grep -m1 '^version' crates/panel/Cargo.toml | cut -d'"' -f2)
            if [ "v$cargo" != "$GITHUB_REF_NAME" ]; then
              echo "::error::il tag $GITHUB_REF_NAME non corrisponde a crates/panel/Cargo.toml ($cargo)"
              exit 1
            fi
            { echo "tags=$GITHUB_REF_NAME"; echo "build=$GITHUB_REF_NAME"; echo "channel=release"; } >> "$GITHUB_OUTPUT"
          else
            short=${GITHUB_SHA::7}
            { echo "tags=dev dev-$short"; echo "build=dev-$short"; echo "channel=dev"; } >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: [ci, meta]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { image: panel, suffix: "", php: "" }
          - { image: php, suffix: "", php: "8.5" }
          # Runtime aggiuntivo (servizio php84 del compose).
          - { image: php, suffix: "-8.4", php: "8.4" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
          REPO: ${{ needs.meta.outputs.registry }}/${{ matrix.image }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          {
            echo "list<<EOF"
            for t in $TAGS; do echo "$REPO:$t$SUFFIX"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Mai `latest`: il pannello si aggiorna scegliendo una versione (o il canale dev).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            ALVEARE_BUILD=${{ needs.meta.outputs.build }}
            ${{ matrix.php && format('PHP_VERSION={0}', matrix.php) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.suffix }}

  # CLI `alveare` per Linux, macOS e Windows.
  cli:
    needs: [ci, meta]
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, file: alveare }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, file: alveare }
          - { os: macos-14, target: aarch64-apple-darwin, file: alveare }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, file: alveare.exe }
    runs-on: ${{ matrix.os }}
    env:
      ALVEARE_BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alveare --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.file }} dist/
          cd dist && tar czf "../alveare-$ALVEARE_BUILD-${{ matrix.target }}.tar.gz" ${{ matrix.file }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: alveare-*.tar.gz

  publish:
    needs: [meta, images, cli]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD: ${{ needs.meta.outputs.build }}
      REGISTRY: ${{ needs.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Release del tag
        if: needs.meta.outputs.channel == 'release'
        run: |
          pre=(); [[ "$BUILD" == *-* ]] && pre=(--prerelease)
          gh release create "$BUILD" dist/*.tar.gz --verify-tag --generate-notes "${pre[@]}" \
            --notes "Immagini: \`$REGISTRY/panel:$BUILD\`, \`$REGISTRY/php:$BUILD\` (e \`-8.4\`). Nel .env: \`ALVEARE_REGISTRY=$REGISTRY\` e \`ALVEARE_VERSION=$BUILD\`, poi \`scripts/aggiorna.sh\`."
      # Una sola pre-release "dev" che segue main: si ricrea a ogni push.
      - name: Pre-release dev
        if: needs.meta.outputs.channel == 'dev'
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/*.tar.gz --prerelease --target "$GITHUB_SHA" --title "Dev ($BUILD)" \
            --notes "Ultimo commit di main ($BUILD), non per la produzione. Immagini: \`$REGISTRY/panel:dev\` e \`$REGISTRY/panel:$BUILD\`."

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { image: panel, suffix: "", php: "" }
          - { image: php, suffix: "", php: "8.5" }
          # Runtime aggiuntivo (servizio php84 del compose).
          - { image: php, suffix: "-8.4", php: "8.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Mai `latest`: il pannello si aggiorna scegliendo una versione.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Con ALVEARE_REGISTRY=ghcr.io/<owner>/alveare e ALVEARE_VERSION=<tag> nel .env il compose usa queste immagini.
          tags: ghcr.io/${{ github.repository_owner }}/alveare/${{ matrix.image }}:${{ github.ref_name }}${{ matrix.suffix }}
          build-args: ${{ matrix.php && format('PHP_VERSION={0}', matrix.php) || '' }}

  # CLI `alveare` per Linux, macOS e Windows, allegata alla release del tag.
  cli:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, file: alveare }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, file: alveare }
          - { os: macos-14, target: aarch64-apple-darwin, file: alveare }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, file: alveare.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p alveare --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.file }} dist/
          cd dist && tar czf ../alveare-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.file }}
      - uses: softprops/action-gh-release@v2
        with:
          files: alveare-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

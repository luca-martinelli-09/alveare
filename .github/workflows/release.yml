name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [panel, php]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Mai `latest`: il pannello si aggiorna scegliendo una versione.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Con ALVEARE_REGISTRY=ghcr.io/<owner>/alveare e ALVEARE_VERSION=<tag> nel .env il compose usa queste immagini.
          tags: ghcr.io/${{ github.repository_owner }}/alveare/${{ matrix.image }}:${{ github.ref_name }}

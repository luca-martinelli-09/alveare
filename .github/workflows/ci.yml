name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Test Rust (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ui:
    name: Interfaccia
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build

  integration:
    name: Integrazione (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: [unit, ui]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Immagini
        run: |
          printf 'ALVEARE_SECRET_KEY=x\nMARIADB_ROOT_PASSWORD=x\n' > .env
          docker compose --profile php84 build
      - name: Compose completo con WordPress vero
        run: python3 tests/integration.py

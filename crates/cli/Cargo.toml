[package]
name = "alveare"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI di Alveare: la stessa API del pannello, con un token personale"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util"] }

[dev-dependencies]
axum = "0.8.9"

[package]
name = "panel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
alveare-core = { version = "0.1.0", path = "../core" }
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
cap-std = "4.0.3"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
libc = "0.2.191"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

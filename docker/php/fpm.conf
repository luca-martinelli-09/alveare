[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no
; Al reload graceful i worker finiscono le richieste in corso.
process_control_timeout = 30s
include = /srv/php/pools/*.conf

; Pool interno: FPM rifiuta di partire senza pool, anche quando non c'è ancora nessun sito.
[_alveare]
user = www-data
group = www-data
listen = /run/php/_alveare.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 1
ping.path = /ping

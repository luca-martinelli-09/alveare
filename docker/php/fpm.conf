[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no
; Al reload graceful i worker finiscono le richieste in corso.
process_control_timeout = 30s
include = /srv/php/pools/*.conf

; Pool interno: FPM rifiuta di partire senza pool, anche quando non c'è ancora nessun sito.
[_alveare]
user = www-data
group = www-data
listen = /run/php/_alveare.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 1
ping.path = /ping

; Adminer, aperto dal pannello con un token monouso (vedi /usr/share/adminer/index.php).
[_adminer]
user = adminer
group = adminer
listen = /run/php/_adminer.sock
listen.owner = root
listen.group = root
listen.mode = 0660
pm = ondemand
pm.max_children = 2
php_admin_value[open_basedir] = /usr/share/adminer/:/srv/adminer/
php_admin_value[session.save_path] = /srv/adminer/sessions
php_admin_value[upload_tmp_dir] = /srv/adminer/tmp
php_admin_value[sys_temp_dir] = /srv/adminer/tmp
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M

date.timezone = Europe/Rome
expose_php = Off
; Opcache è condivisa fra i pool dello stesso master: ogni sito vede solo i propri script.
opcache.validate_root = 1
opcache.validate_permission = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 50000
; Default di produzione di PHP: niente avvisi di deprecazione nell output di WP-CLI e nei log.
error_reporting = E_ALL & ~E_DEPRECATED

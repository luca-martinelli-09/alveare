# Alveare: numero di container fisso, qualunque sia il numero di siti.
name: alveare

x-common: &common
  restart: unless-stopped
  environment:
    TZ: Europe/Rome
  networks: [hosting]

# Container PHP: stessi volumi per il principale, le altre versioni e il canary.
x-php: &php
  <<: *common
  volumes:
    - ./data/sites:/srv/sites
    - ./data/logs:/srv/logs
    - ./data/tmp:/srv/tmp
    - ./data/php:/srv/php
    - ./data/adminer:/srv/adminer
    - ./data/run/php:/run/php
    - ./data/run/alveare:/run/alveare
  depends_on:
    panel: { condition: service_healthy }

services:
  panel:
    <<: *common
    # Solo rete di controllo: il codice PHP dei siti non deve poter raggiungere l'API.
    networks: [control]
    image: ${ALVEARE_REGISTRY:-alveare}/panel:${ALVEARE_VERSION:-dev}
    build: { context: ., dockerfile: docker/panel/Dockerfile }
    env_file: .env
    volumes:
      # Un solo mount: tra sites/, tmp/ e trash/ i file si spostano con un rename.
      - ./data:/srv
      # Scrivibile: "salva come template" vi crea i template snapshot.
      - ./templates:/srv/templates
      - ./data/run/caddy:/run/caddy
      - ./data/run/alveare:/run/alveare
    depends_on:
      mariadb: { condition: service_healthy }

  php:
    <<: *php
    image: ${ALVEARE_REGISTRY:-alveare}/php:${ALVEARE_VERSION:-dev}
    build: { context: ., dockerfile: docker/php/Dockerfile }

  # Runtime PHP aggiuntivi: un container per versione, mai uno per sito. Si accendono con il
  # profilo (docker compose --profile php84 up -d) e ALVEARE_PHP_RUNTIMES=8.4 nel .env.
  php84:
    <<: *php
    profiles: [php84]
    image: ${ALVEARE_REGISTRY:-alveare}/php:${ALVEARE_VERSION:-dev}-8.4
    build: { context: ., dockerfile: docker/php/Dockerfile, args: { PHP_VERSION: "8.4" } }
    environment: { TZ: Europe/Rome, ALVEARE_PHP_RUNTIME: "8.4" }

  # Canary: la nuova immagine PHP provata su un sito di prova prima di darla a tutti
  # (ALVEARE_CANARY_VERSION=<nuova versione>, ALVEARE_PHP_RUNTIMES=canary, profilo canary).
  php-canary:
    <<: *php
    profiles: [canary]
    image: ${ALVEARE_REGISTRY:-alveare}/php:${ALVEARE_CANARY_VERSION:-dev}
    environment: { TZ: Europe/Rome, ALVEARE_PHP_RUNTIME: canary }

  # Processi long-running delle app Laravel (code, Horizon, Reverb): stessa immagine, l'agente
  # fa da supervisore. Separato da FPM: un reload dei pool non tocca i worker e viceversa.
  php-workers:
    <<: *php
    profiles: [workers]
    image: ${ALVEARE_REGISTRY:-alveare}/php:${ALVEARE_VERSION:-dev}
    environment: { TZ: Europe/Rome, ALVEARE_ROLE: workers }

  caddy:
    <<: *common
    image: caddy:2
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./data/caddy/config:/etc/caddy:ro
      - ./data/caddy/data:/data
      - ./data/sites:/srv/sites:ro
      - ./data/logs:/srv/logs
      - ./data/run/php:/run/php
      - ./data/run/caddy:/run/caddy
    networks: [hosting, control, cloudflared]
    depends_on:
      panel: { condition: service_healthy }

  redis:
    <<: *common
    networks: [hosting, control]
    image: redis:8
    # Cache: memoria fissa, si scarta il meno usato. L'ACL (un utente per sito) la scrive il pannello.
    command: ["redis-server", "--aclfile", "/data/users.acl", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    depends_on:
      panel: { condition: service_healthy }

  mariadb:
    <<: *common
    networks: [hosting, control]
    image: mariadb:12
    environment:
      TZ: Europe/Rome
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD mancante nel .env}
    command: ["--default-time-zone=Europe/Rome"]
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  hosting: {}
  control: {}
  # Rete dei connettori cloudflared: tutti puntano a http://caddy:80.
  cloudflared:
    external: true
    name: ${ALVEARE_CLOUDFLARED_NETWORK:-cloudflared}
